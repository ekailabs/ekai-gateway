services:
  gateway:
    build: .
    image: ghcr.io/ekailabs/ekai-gateway:oasis@sha256:6962d2e4381347ab6f0ed8f1f8dcde65a0c638ba777207b4579be5f600c34a14
    environment:
      PORT: ${PORT:-3001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      # Oasis Sapphire MAINNET (keys are fetched from the on-chain control plane, not env)
      SAPPHIRE_RPC_URL: ${SAPPHIRE_RPC_URL:-https://sapphire.oasis.io}
      SAPPHIRE_CHAIN_ID: ${SAPPHIRE_CHAIN_ID:-23294}
      EKAI_CONTROL_PLANE_ADDRESS: ${EKAI_CONTROL_PLANE_ADDRESS:-0x8212Da9695946dc97B89d2F7D2B47E623CE5d87b}
    ports:
      - "3001:3001"
    # Defense-in-depth against FD exhaustion. The per-request on-chain receipt
    # submission that previously leaked appd sockets under load has been removed, but
    # keep a high descriptor ceiling so no future burst trips "Too many open files".
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /run/rofl-appd.sock:/run/rofl-appd.sock
      - gateway_logs:/app/gateway/logs
      - gateway_db:/app/gateway/data
    restart: unless-stopped

volumes:
  gateway_logs:
  gateway_db:
