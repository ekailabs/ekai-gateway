services:
  gateway:
    build: .
    image: ghcr.io/ekailabs/ekai-gateway:oasis@sha256:6f957bc2fe090766b5d743cfcb191717f92d17bed941d61a43f04fc01cacc981
    environment:
      PORT: ${PORT:-3001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      # Oasis Sapphire MAINNET (keys are fetched from the on-chain control plane, not env)
      SAPPHIRE_RPC_URL: ${SAPPHIRE_RPC_URL:-https://sapphire.oasis.io}
      SAPPHIRE_CHAIN_ID: ${SAPPHIRE_CHAIN_ID:-23294}
      EKAI_CONTROL_PLANE_ADDRESS: ${EKAI_CONTROL_PLANE_ADDRESS:-0x8212Da9695946dc97B89d2F7D2B47E623CE5d87b}
    ports:
      - "3001:3001"
    volumes:
      - /run/rofl-appd.sock:/run/rofl-appd.sock
      - gateway_logs:/app/gateway/logs
      - gateway_db:/app/gateway/data
    restart: unless-stopped

volumes:
  gateway_logs:
  gateway_db:
