services:
  gateway:
    build: .
    image: ghcr.io/ekailabs/ekai-gateway:oasis@sha256:a3b96bf85642a3697f2fbf05d8d6f69f5872b3a51ac3b4875dd087fdf14f7ee8
    environment:
      PORT: ${PORT:-3001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      # Oasis Sapphire MAINNET (keys are fetched from the on-chain control plane, not env)
      SAPPHIRE_RPC_URL: ${SAPPHIRE_RPC_URL:-https://sapphire.oasis.io}
      SAPPHIRE_CHAIN_ID: ${SAPPHIRE_CHAIN_ID:-23294}
      EKAI_CONTROL_PLANE_ADDRESS: ${EKAI_CONTROL_PLANE_ADDRESS:-0x98782c35ed89a829FC1997BD54CFc95B653fE20E}
    ports:
      - "3001:3001"
    volumes:
      - /run/rofl-appd.sock:/run/rofl-appd.sock
      - gateway_logs:/app/gateway/logs
      - gateway_db:/app/gateway/data
    restart: unless-stopped

volumes:
  gateway_logs:
  gateway_db:
